version: "3.9"

services:

  app:
    build: .
    container_name: noshow-iq-12826-app-1
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/noshow_iq
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: noshow-iq-12826-mongodb-1
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      default:
        aliases:
          - mongo

  mongo-express:
    image: mongo-express:latest
    container_name: noshow-iq-12826-mongo-express-1
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  default:
